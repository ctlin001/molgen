<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">MolGen pipeline</title>
  <desc id="desc">Seven-stage left-to-right pipeline for pocket-conditioned small-molecule and PROTAC linker generation. Only stage 3 (Generate) uses a language model, and it emits text only; all other stages are deterministic.</desc>

  <style>
    :root {
      --fg:        #1b1f24;
      --muted:     #5c6773;
      --line:      #8b949e;
      --box-bg:    #ffffff00;
      --box-line:  #384a5e;
      --cool:      #2f6f9f;
      --cool-fill: #2f6f9f14;
      --warm:      #c2681c;
      --warm-fill: #c2681c1a;
      --gate:      #2e7d5b;
      --dotted:    #b0b8c1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:        #e6edf3;
        --muted:     #9aa7b4;
        --line:      #77828d;
        --box-bg:    #ffffff00;
        --box-line:  #7d93ab;
        --cool:      #6fb2e0;
        --cool-fill: #6fb2e01f;
        --warm:      #e8995a;
        --warm-fill: #e8995a24;
        --gate:      #63c69b;
        --dotted:    #5a646e;
      }
    }
    .f      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
    .title  { font-size: 22px; font-weight: 600; fill: var(--fg); }
    .subtit { font-size: 14px; fill: var(--muted); }
    .stage  { font-size: 19px; font-weight: 600; fill: var(--fg); }
    .sub    { font-size: 13px; fill: var(--muted); }
    .num    { font-size: 13px; font-weight: 600; fill: var(--cool); }
    .note   { font-size: 13px; fill: var(--muted); }
    .bandlb { font-size: 15px; font-weight: 600; }
    .bandsb { font-size: 13px; }
    .cap    { font-size: 24px; font-weight: 600; fill: var(--fg); }
    .box    { fill: var(--box-bg); stroke: var(--box-line); stroke-width: 1.4; }
    .arrow  { fill: none; stroke: var(--line); stroke-width: 1.4; }
    .branch { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .fb     { fill: none; stroke: var(--cool); stroke-width: 1.4; }
    .tick   { stroke: var(--dotted); stroke-width: 1.2; stroke-dasharray: 3 4; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--line)"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--cool)"/>
    </marker>
  </defs>

  <!-- heading -->
  <text class="f title" x="42" y="38">MolGen — pocket-conditioned small-molecule and PROTAC linker generation</text>

  <!-- feedback arc: stage 6 -> stage 2 -->
  <path class="fb" d="M1264,150 C1264,104 1200,104 1160,104 L440,104 C400,104 334,104 334,150" marker-end="url(#ahc)"/>
  <text class="f note" x="800" y="94" text-anchor="middle">refinement rounds — feedback computed from measured results, not model self-assessment</text>

  <!-- stage boxes -->
  <g>
    <rect class="box" x="42"   y="150" width="175" height="112" rx="10"/>
    <text class="f num"   x="62" y="178">1</text>
    <text class="f stage" x="62" y="204">Pocket</text>
    <text class="f sub"   x="62" y="228">BioPython, KD-tree,</text>
    <text class="f sub"   x="62" y="246">5 Å cutoff</text>

    <rect class="box" x="247"  y="150" width="175" height="112" rx="10"/>
    <text class="f num"   x="267" y="178">2</text>
    <text class="f stage" x="267" y="204">Prompt</text>
    <text class="f sub"   x="267" y="228">assembled</text>
    <text class="f sub"   x="267" y="246">deterministic context</text>

    <rect class="box" x="492"  y="150" width="175" height="112" rx="10" stroke="var(--warm)" stroke-dasharray="6 4"/>
    <text class="f num"   x="512" y="178" fill="var(--warm)">3</text>
    <text class="f stage" x="512" y="204">Generate</text>
    <text class="f sub"   x="512" y="228">Gemma 3 12B,</text>
    <text class="f sub"   x="512" y="246">local via Ollama</text>

    <rect class="box" x="737"  y="150" width="175" height="112" rx="10"/>
    <text class="f num"   x="757" y="178">4</text>
    <text class="f stage" x="757" y="204">Validate</text>
    <text class="f sub"   x="757" y="228">RDKit: Ro5, PAINS/</text>
    <text class="f sub"   x="757" y="246">Brenk, QED, 3D embed</text>

    <rect class="box" x="942"  y="150" width="175" height="112" rx="10"/>
    <text class="f num"   x="962" y="178">5</text>
    <text class="f stage" x="962" y="204">Diversity</text>
    <text class="f sub"   x="962" y="228">InChIKey dedup, Bemis–</text>
    <text class="f sub"   x="962" y="246">Murcko, novelty screen</text>

    <rect class="box" x="1177" y="150" width="175" height="112" rx="10"/>
    <text class="f num"   x="1197" y="178">6</text>
    <text class="f stage" x="1197" y="204">Dock</text>
    <text class="f sub"   x="1197" y="228">AutoDock Vina, derived</text>
    <text class="f sub"   x="1197" y="246">box, Hungarian RMSD</text>

    <rect class="box" x="1382" y="150" width="175" height="112" rx="10"/>
    <text class="f num"   x="1402" y="178">7</text>
    <text class="f stage" x="1402" y="204">Report</text>
    <text class="f sub"   x="1402" y="228">HTML / CSV / JSON</text>
  </g>

  <!-- straight arrows -->
  <path class="arrow" d="M217,206 L241,206"   marker-end="url(#ah)"/>
  <path class="arrow" d="M667,206 L731,206"   marker-end="url(#ah)"/>
  <path class="arrow" d="M912,206 L936,206"   marker-end="url(#ah)"/>
  <path class="arrow" d="M1117,206 L1129,206" marker-end="url(#ah)"/>
  <path class="arrow" d="M1165,206 L1171,206" marker-end="url(#ah)"/>
  <path class="arrow" d="M1352,206 L1376,206" marker-end="url(#ah)"/>

  <!-- mode branch: after stage 2, rejoining before stage 4 -->
  <path class="branch" d="M422,206 C448,206 448,300 457,300 C466,300 466,206 492,206"/>
  <path class="branch" d="M422,206 C452,206 452,352 457,352 C462,352 462,206 492,206"/>
  <circle cx="422" cy="206" r="3.2" fill="var(--line)"/>
  <circle cx="492" cy="206" r="3.2" fill="var(--line)"/>
  <text class="f note" x="480" y="296">ligand mode</text>
  <text class="f note" x="480" y="348">PROTAC linker mode</text>

  <!-- diversity gate between 5 and 6 -->
  <g>
    <path d="M1147,188 L1163,206 L1147,224 L1131,206 Z" fill="none" stroke="var(--gate)" stroke-width="1.6"/>
    <path d="M1140,206 L1145,212 L1155,200" fill="none" stroke="var(--gate)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="f note" x="1147" y="300" text-anchor="middle" fill="var(--gate)">gate — scaffold diversity ≥ 0.30</text>
    <text class="f note" x="1147" y="318" text-anchor="middle">enforced, not merely reported</text>
  </g>

  <!-- tie stage 3 to the LLM band -->
  <path class="tick" d="M579,262 L579,430"/>

  <!-- responsibility band -->
  <g>
    <rect x="42" y="430" width="428" height="82" rx="8" fill="var(--cool-fill)" stroke="var(--cool)" stroke-width="1.4"/>
    <text class="f bandlb" x="62" y="464" fill="var(--cool)">Deterministic</text>
    <text class="f bandsb" x="62" y="488" fill="var(--muted)">pocket extraction, context assembly</text>

    <rect x="490" y="430" width="180" height="82" rx="8" fill="var(--warm-fill)" stroke="var(--warm)" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text class="f bandlb" x="580" y="460" text-anchor="middle" fill="var(--warm)">LLM</text>
    <text class="f bandsb" x="580" y="480" text-anchor="middle" fill="var(--warm)">language and intent</text>
    <text class="f bandsb" x="580" y="500" text-anchor="middle" fill="var(--muted)">emits text only</text>

    <rect x="690" y="430" width="867" height="82" rx="8" fill="var(--cool-fill)" stroke="var(--cool)" stroke-width="1.4"/>
    <text class="f bandlb" x="712" y="464" fill="var(--cool)">Deterministic — RDKit, BioPython, Vina</text>
    <text class="f bandsb" x="712" y="488" fill="var(--muted)">chemistry filters, scaffold analysis, docking and scoring, reporting — no model judgement anywhere downstream</text>
  </g>

  <text class="f cap" x="42" y="562">LLMs propose. RDKit disposes.</text>
  <text class="f subtit" x="42" y="590">Stage 3 is the only point at which a language model acts, and its sole output is text; every other stage is reproducible code.</text>
</svg>
