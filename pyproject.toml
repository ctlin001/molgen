[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molgen"
version = "2.0.0"
description = "Pocket-conditioned molecule and PROTAC linker generation with local LLMs, RDKit and AutoDock Vina"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cheminformatics", "drug-discovery", "llm", "docking", "rdkit", "protac"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# RDKit and Open Babel come from conda — see environment.yaml.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "biopython>=1.81",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
cloud = ["openai>=1.0"]
cif = ["gemmi>=0.6.4"]
viz = ["matplotlib>=3.7", "pillow>=10.0", "jupyter", "ipywidgets"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
molgen = "molgen.cli:main"

[project.urls]
Documentation = "https://github.com/<org>/molgen/blob/main/docs/architecture.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a real docking run or LLM call",
    "requires_vina: needs an AutoDock Vina executable",
    "requires_llm: needs a reachable Ollama server",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
